name: Inject commit SHA

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  inject-sha:
    runs-on: ubuntu-latest
    # Prevent the workflow from running on its own commits (avoids infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace COMMIT_SHA
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "Replacing COMMIT_SHA with $SHORT_SHA"
          # Replace in all HTML files
          find . -name "*.html" -exec sed -i "s/COMMIT_SHA/${SHORT_SHA}/g" {} +

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if something actually changed
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add .
            git commit -m "Update commit SHA [skip ci]"
            git push
          fi
