name: Deploy with commit SHA

on:
  push:
    branches: [ main ]   # or master, whatever you use

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject commit SHA
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # Replace in all HTML files
          find . -name "*.html" -exec sed -i "s/COMMIT_SHA/${SHORT_SHA}/g" {} +

      # If you deploy via a special branch or action, put that step here.
      # For classic GitHub Pages (push to gh-pages or main),
      # you may not need anything else if the site is served directly from the branch.
